<div class="pagina-cadastro">

<div class="cadastro-caixa">

    <h1>Cadastrar Empresa</h1>

    <p>
        Crie uma conta para publicar na Feira Tecnológica.
    </p>

    <form id="formCadastro">

        <label for="nome">
            Nome da empresa
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Nome da empresa"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <p id="mensagem"></p>

    <a href="index.php?pagina=login">
        Já possui uma conta? Entrar
    </a>

</div>

</div>

<style>

/* Base Clara (Padrão) */
.pagina-cadastro,
.pagina-conta {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-color: #f4f4f4;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.cadastro-caixa,
.caixa-conta {
    width: 100%;
    max-width: 450px;
    padding: 40px;
    background-color: #ffffff;
    color: #222222;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
    text-align: center;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.cadastro-caixa h1,
.caixa-conta h1 {
    margin-bottom: 10px;
}

.cadastro-caixa p,
.caixa-conta p {
    margin-bottom: 25px;
    color: #666666;
}

.cadastro-caixa form,
.caixa-conta form {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.cadastro-caixa label,
.caixa-conta label {
    margin-bottom: 6px;
    margin-top: 10px;
    font-weight: bold;
}

.cadastro-caixa input,
.caixa-conta input {
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background-color: #ffffff;
    color: #222222;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
}

/* Botão ajustado com !important para garantir o vermelho e texto branco */
.cadastro-caixa button,
.caixa-conta button {
    padding: 14px;
    border: none !important;
    border-radius: 8px;
    background-color: #b51218 !important;
    color: #ffffff !important;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.2s;
}

.cadastro-caixa button:hover,
.caixa-conta button:hover {
    background-color: #940e13 !important;
}

.cadastro-caixa a,
.caixa-conta a {
    color: #b51218;
    text-decoration: none;
}

/* ============================================================
   Sobregravação para Modo Noturno (Suporte completo)
   ============================================================ */

body.tema-noturno .pagina-cadastro,
body.dark-mode .pagina-cadastro,
body.tema-noturno .pagina-conta,
body.dark-mode .pagina-conta {
    background-color: #121212 !important;
}

body.tema-noturno .cadastro-caixa,
body.dark-mode .cadastro-caixa,
body.tema-noturno .caixa-conta,
body.dark-mode .caixa-conta {
    background-color: #1e1e1e !important;
    color: #ffffff !important;
    border: 1px solid #2a2a2a;
}

body.tema-noturno .cadastro-caixa h1,
body.dark-mode .cadastro-caixa h1,
body.tema-noturno .caixa-conta h1,
body.dark-mode .caixa-conta h1 {
    color: #ffffff !important;
}

body.tema-noturno .cadastro-caixa p,
body.dark-mode .cadastro-caixa p,
body.tema-noturno .caixa-conta p,
body.dark-mode .caixa-conta p {
    color: #cccccc !important;
}

body.tema-noturno .cadastro-caixa label,
body.dark-mode .cadastro-caixa label,
body.tema-noturno .caixa-conta label,
body.dark-mode .caixa-conta label {
    color: #ffffff !important;
}

body.tema-noturno .cadastro-caixa input,
body.dark-mode .cadastro-caixa input,
body.tema-noturno .caixa-conta input,
body.dark-mode .caixa-conta input {
    background-color: #2b2b2b !important;
    color: #ffffff !important;
    border-color: #444444 !important;
}

body.tema-noturno .cadastro-caixa button,
body.dark-mode .cadastro-caixa button,
body.tema-noturno .caixa-conta button,
body.dark-mode .caixa-conta button {
    background-color: #b51218 !important;
    color: #ffffff !important;
}

body.tema-noturno .cadastro-caixa a,
body.dark-mode .cadastro-caixa a,
body.tema-noturno .caixa-conta a,
body.dark-mode .caixa-conta a {
    color: #ff5555 !important;
}

</style>

<script>

const formCadastro =
    document.getElementById(
        "formCadastro"
    );

const mensagem =
    document.getElementById(
        "mensagem"
    );


async function verificarSessao() {

    try {

        const resposta =
            await fetch(
                "http://localhost:3000/api/auth/sessao",
                {
                    credentials: "include"
                }
            );


        const sessao =
            await resposta.json();


        if (sessao.ativa) {

            formCadastro.style.display =
                "none";

            mensagem.textContent =
                "Já existe uma conta ativa. Saia da conta atual para criar outra.";

        }

    } catch (erro) {

        console.log(
            "Erro ao verificar sessão:",
            erro
        );

    }

}


verificarSessao();


formCadastro.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const nome =
            document.getElementById(
                "nome"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const senha =
            document.getElementById(
                "senha"
            ).value;


        mensagem.textContent =
            "Cadastrando...";


        try {

            const resposta =
                await fetch(
                    "http://localhost:3000/api/auth/cadastro",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            nome: nome,

                            email: email,

                            senha: senha

                        })
                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                mensagem.textContent =
                    dados.erro ||
                    "Erro ao cadastrar empresa.";

                return;

            }


            mensagem.textContent =
                "Empresa cadastrada com sucesso!";


            formCadastro.reset();


            setTimeout(
                function() {

                    window.location.href =
                        "index.php?pagina=login";

                },
                1000
            );

        } catch (erro) {

            console.log(erro);

            mensagem.textContent =
                "Não foi possível conectar com o servidor.";

        }

    }
);

</script>
