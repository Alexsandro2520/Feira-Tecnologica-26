<div class="pagina-eventos">

    <h1>Eventos</h1>

    <div id="eventos">
        Carregando eventos...
    </div>

</div>


<style>

.pagina-eventos {
    padding: 40px 20px;
    max-width: 1100px;
    margin: auto;
    color: #222222;
    transition: color 0.3s ease;
}

.pagina-eventos h1 {
    margin-bottom: 30px;
}

.lista-eventos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

/* Força os cards a serem flexíveis e iguais */
.evento {
    background: #ffffff;
    border: 1px solid #dddddd;
    padding: 20px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: background-color 0.3s ease, border-color 0.3s ease;
}

/* Contêiner de imagem com altura e fundo padronizados */
.evento-imagem {
    width: 100%;
    height: 200px;
    background-color: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.evento-imagem img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Ícone/texto padrão para quando não houver foto */
.sem-imagem {
    color: #888888;
    font-size: 14px;
    font-weight: bold;
}

.evento h2 {
    margin-bottom: 10px;
}

.empresa {
    color: #777777;
    font-size: 14px;
    margin-bottom: 12px;
    transition: color 0.3s ease;
}

.data {
    font-weight: bold;
    color: #b51218;
    margin-bottom: 12px;
    transition: color 0.3s ease;
}

.descricao {
    color: #555555;
    margin-bottom: 15px;
    transition: color 0.3s ease;
    flex: 1; /* Ocupa o espaço livre empurrando o footer/botão para baixo */
}

.info {
    color: #777777;
    font-size: 14px;
    margin-bottom: 15px;
    transition: color 0.3s ease;
}

/* O botão sempre ficará no fim do card */
.evento a {
    display: inline-block;
    align-self: flex-start;
    margin-top: auto;
    background: #b51218 !important;
    color: #ffffff !important;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    transition: background-color 0.2s ease;
}

.evento a:hover {
    background: #941016 !important;
}

.vazio {
    padding: 30px;
    background: #f4f4f4;
    border-radius: 8px;
    text-align: center;
    transition: background-color 0.3s ease, color 0.3s ease;
}

@media (max-width: 700px) {

    .lista-eventos {
        grid-template-columns: 1fr;
    }

}

/* Tema Noturno */
body.tema-noturno .pagina-eventos,
body.dark-mode .pagina-eventos {
    color: #ffffff !important;
}

body.tema-noturno .evento,
body.dark-mode .evento {
    background: #1e1e1e !important;
    border-color: #2a2a2a !important;
}

body.tema-noturno .evento-imagem,
body.dark-mode .evento-imagem {
    background-color: #2a2a2a !important;
}

body.tema-noturno .sem-imagem,
body.dark-mode .sem-imagem {
    color: #aaaaaa !important;
}

body.tema-noturno .empresa,
body.dark-mode .empresa {
    color: #aaaaaa !important;
}

body.tema-noturno .data,
body.dark-mode .data {
    color: #ff5555 !important;
}

body.tema-noturno .descricao,
body.dark-mode .descricao {
    color: #dddddd !important;
}

body.tema-noturno .info,
body.dark-mode .info {
    color: #aaaaaa !important;
}

body.tema-noturno .vazio,
body.dark-mode .vazio {
    background: #1e1e1e !important;
    color: #ffffff !important;
    border: 1px solid #2a2a2a;
}

</style>


<script>

async function carregarEventos() {

    const area =
        document.getElementById("eventos");

    try {

        const resposta =
            await fetch(
                "http://localhost:3000/api/posts?tipo=evento"
            );

        const eventos =
            await resposta.json();


        if (!resposta.ok) {

            area.innerHTML =
                `<div class="vazio">
                    Erro ao carregar eventos.
                </div>`;

            return;
        }


        if (eventos.length === 0) {

            area.innerHTML =
                `<div class="vazio">
                    Nenhum evento publicado ainda.
                </div>`;

            return;
        }


        area.innerHTML =
            `<div class="lista-eventos"></div>`;


        const lista =
            area.querySelector(
                ".lista-eventos"
            );


        eventos.forEach(
            function (evento) {

                /* Renderiza a imagem do evento ou a moldura placeholder */
                const imagemHTML =
                    evento.imagem
                        ? `<img src="http://localhost:3000/uploads/${evento.imagem}" alt="${escaparHTML(evento.titulo)}">`
                        : `<span class="sem-imagem">Sem Imagem</span>`;


                const data =
                    formatarData(
                        evento.data_evento
                    );


                lista.innerHTML += `

                    <article class="evento">

                        <div class="evento-imagem">
                            ${imagemHTML}
                        </div>

                        <h2>
                            ${escaparHTML(evento.titulo)}
                        </h2>

                        <div class="empresa">
                            Publicado por:
                            ${escaparHTML(evento.empresa_nome)}
                        </div>

                        <div class="data">
                            Data:
                            ${data}
                        </div>

                        <div class="descricao">
                            ${escaparHTML(evento.descricao)}
                        </div>

                        <div class="info">

                            Curtidas:
                            ${evento.total_likes}

                            |

                            Comentários:
                            ${evento.total_comentarios}

                        </div>

                        <a
                            href="index.php?pagina=publicacao&id=${evento.id}"
                        >
                            Ver evento
                        </a>

                    </article>

                `;

            }
        );

    } catch (erro) {

        console.log(erro);

        area.innerHTML =
            `<div class="vazio">
                Erro ao conectar com o servidor.
            </div>`;

    }

}


function formatarData(data) {

    if (!data) {
        return "";
    }

    const partes =
        String(data)
            .substring(0, 10)
            .split("-");

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}

function escaparHTML(texto) {
    const div = document.createElement("div");
    div.textContent = texto || "";
    return div.innerHTML;
}


carregarEventos();

</script>
