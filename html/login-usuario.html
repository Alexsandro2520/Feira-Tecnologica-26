<div class="pagina-conta">

    <div class="caixa-conta">

        <h1>Entrar</h1>

        <p>
            Entre na sua conta para curtir e comentar.
        </p>

        <form id="formLogin">

            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p id="mensagem"></p>

        <p>
            Ainda não tem conta?

            <a href="index.php?pagina=cadastro-usuario">
                Criar conta
            </a>
        </p>

    </div>

</div>

<style>

.pagina-conta {
    min-height: calc(100vh - 80px);
    background: #f4f4f4;
    padding: 50px 20px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.caixa-conta {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}

.caixa-conta h1 {
    margin-top: 0;
    color: #222222;
    transition: color 0.3s ease;
}

.caixa-conta p {
    color: #555555;
    transition: color 0.3s ease;
}

.caixa-conta form {
    display: flex;
    flex-direction: column;
}

.caixa-conta label {
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #222222;
    transition: color 0.3s ease;
}

.caixa-conta input {
    padding: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
    border-radius: 4px;
    background-color: #ffffff;
    color: #222222;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

.caixa-conta button {
    margin-top: 25px;
    padding: 13px;
    border: 0;
    background-color: #b51218 !important;
    color: #ffffff !important;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
    transition: background-color 0.2s ease;
}

.caixa-conta button:hover {
    background-color: #941016 !important;
}

.caixa-conta a {
    color: #b51218;
    text-decoration: underline;
}

body.tema-noturno .pagina-conta,
body.dark-mode .pagina-conta {
    background-color: #121212 !important;
}

body.tema-noturno .caixa-conta,
body.dark-mode .caixa-conta {
    background-color: #1e1e1e !important;
    color: #ffffff !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    border: 1px solid #2a2a2a;
}

body.tema-noturno .caixa-conta h1,
body.dark-mode .caixa-conta h1 {
    color: #ffffff !important;
}

body.tema-noturno .caixa-conta p,
body.dark-mode .caixa-conta p {
    color: #cccccc !important;
}

body.tema-noturno .caixa-conta label,
body.dark-mode .caixa-conta label {
    color: #ffffff !important;
}

body.tema-noturno .caixa-conta input,
body.dark-mode .caixa-conta input {
    background-color: #2a2a2a !important;
    color: #ffffff !important;
    border-color: #444444 !important;
}

body.tema-noturno .caixa-conta a,
body.dark-mode .caixa-conta a {
    color: #ff4d4d !important;
}

</style>

<script>

const form =
    document.getElementById(
        "formLogin"
    );

const mensagem =
    document.getElementById(
        "mensagem"
    );


async function verificarSessao() {

    try {

        const resposta =
            await fetch(
                "http://localhost:3000/api/auth/sessao",
                {
                    credentials: "include"
                }
            );


        const sessao =
            await resposta.json();


        if (sessao.ativa) {

            form.style.display =
                "none";

            mensagem.textContent =
                "Já existe uma conta ativa. Saia da conta atual para entrar em outra.";

        }

    } catch (erro) {

        console.log(
            "Erro ao verificar sessão:",
            erro
        );

    }

}


verificarSessao();


form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        mensagem.textContent =
            "Entrando...";


        try {

            const resposta =
                await fetch(
                    "http://localhost:3000/api/auth/usuario/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            email:
                                document.getElementById(
                                    "email"
                                ).value.trim(),

                            senha:
                                document.getElementById(
                                    "senha"
                                ).value

                        })
                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                mensagem.textContent =
                    dados.erro ||
                    "Email ou senha incorretos.";

                return;

            }


            localStorage.removeItem(
                "empresa"
            );


            localStorage.setItem(
                "usuario",
                JSON.stringify(
                    dados.usuario
                )
            );


            const voltar =
                localStorage.getItem(
                    "voltarPublicacao"
                );


            if (voltar) {

                localStorage.removeItem(
                    "voltarPublicacao"
                );

                window.location.href =
                    voltar;

                return;

            }


            window.location.href =
                "index.php";


        } catch (erro) {

            console.log(erro);

            mensagem.textContent =
                "Erro ao conectar com o servidor.";

        }

    }
);

</script>
