<div class="pagina-conta">


<div class="caixa-conta">

    <h1>Criar conta</h1>

    <p>
        Crie sua conta para participar das publicações.
    </p>

    <form id="formCadastro">

        <label>Nome</label>

        <input
            type="text"
            id="nome"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Senha</label>

        <input
            type="password"
            id="senha"
            required
        >

        <button type="submit">
            Criar conta
        </button>

    </form>

    <p id="mensagem"></p>

    <p>
        Já possui uma conta?
        <a href="index.php?pagina=login-usuario">
            Entrar
        </a>
    </p>

</div>


</div>

<style>

/* Base do container */
.pagina-conta {
    min-height: calc(100vh - 80px);
    background: var(--bg-principal, #f4f4f4);
    padding: 50px 20px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* Caixa do formulário */
.caixa-conta {
    max-width: 500px;
    margin: auto;
    background: var(--bg-card, #ffffff);
    color: var(--texto-principal, #222222);
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: background-color 0.3s ease, color 0.3s ease;
}

.caixa-conta form {
    display: flex;
    flex-direction: column;
}

.caixa-conta label {
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: inherit;
}

/* Campos de entrada */
.caixa-conta input {
    padding: 12px;
    border: 1px solid var(--borda, #ccc);
    background-color: var(--bg-input, #ffffff);
    color: var(--texto-input, #222222);
    font-size: 16px;
    border-radius: 6px;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
}

/* Botão e links */
.caixa-conta button {
    margin-top: 25px;
    padding: 13px;
    border: 0;
    background: #b51218;
    color: white;
    cursor: pointer;
    font-size: 16px;
    border-radius: 6px;
}

.caixa-conta a {
    color: #b51218;
}

/* ============================================================
   Sobregravação direta quando o Modo Noturno estiver ativo
   ============================================================ */

body.tema-noturno .pagina-conta,
body.dark-mode .pagina-conta {
    background: #121212 !important;
}

body.tema-noturno .caixa-conta,
body.dark-mode .caixa-conta {
    background: #1e1e1e !important;
    color: #ffffff !important;
    border: 1px solid #2a2a2a;
}

body.tema-noturno .caixa-conta h1,
body.tema-noturno .caixa-conta p,
body.tema-noturno .caixa-conta label,
body.dark-mode .caixa-conta h1,
body.dark-mode .caixa-conta p,
body.dark-mode .caixa-conta label {
    color: #ffffff !important;
}

body.tema-noturno .caixa-conta input,
body.dark-mode .caixa-conta input {
    background-color: #2b2b2b !important;
    color: #ffffff !important;
    border-color: #444444 !important;
}

body.tema-noturno .caixa-conta a,
body.dark-mode .caixa-conta a {
    color: #ff4d4d !important;
}

</style>

<script>

const form =
    document.getElementById(
        "formCadastro"
    );

const mensagem =
    document.getElementById(
        "mensagem"
    );


async function verificarSessao() {

    try {

        const resposta =
            await fetch(
                "http://localhost:3000/api/auth/sessao",
                {
                    credentials: "include"
                }
            );


        const sessao =
            await resposta.json();


        if (sessao.ativa) {

            form.style.display =
                "none";

            mensagem.textContent =
                "Já existe uma conta ativa. Saia da conta atual para criar outra.";

        }

    } catch (erro) {

        console.log(
            "Erro ao verificar sessão:",
            erro
        );

    }

}


verificarSessao();


form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        mensagem.textContent =
            "Criando conta...";


        try {

            const resposta =
                await fetch(
                    "http://localhost:3000/api/auth/usuario/cadastro",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            nome:
                                document.getElementById(
                                    "nome"
                                ).value.trim(),

                            email:
                                document.getElementById(
                                    "email"
                                ).value.trim(),

                            senha:
                                document.getElementById(
                                    "senha"
                                ).value

                        })

                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                mensagem.textContent =
                    dados.erro ||
                    "Erro ao criar conta.";

                return;

            }


            mensagem.textContent =
                "Conta criada! Redirecionando...";


            setTimeout(
                function () {

                    window.location.href =
                        "index.php?pagina=login-usuario";

                },
                1000
            );


        } catch (erro) {

            console.log(erro);

            mensagem.textContent =
                "Erro ao conectar com o servidor.";

        }

    }
);

</script>
