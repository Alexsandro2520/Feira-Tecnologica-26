<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo de Ribeirão Pires</title>
</head>
<body>
    <section class="turismo">

<section class="turismo">

    <h1>Turismo em Ribeirão Pires</h1>

    <div class="turismo-container">

        <div class="turismo-cards">

            <div class="turismo-card">
                <div class="turismo-card-imagem">
                    <img src="img/torre-miroku.jpg" alt="Torre de Miroku">
                </div>

                <div class="turismo-card-conteudo">
                    <h2>Torre de Miroku</h2>
                    <p>
                        Um dos principais cartões-postais de Ribeirão Pires.
                    </p>
                    <button>CONHECER</button>
                </div>
            </div>

            <div class="turismo-card">
                <div class="turismo-card-imagem">
                    <img src="img/parque-oriental.jpg" alt="Parque Oriental">
                </div>

                <div class="turismo-card-conteudo">
                    <h2>Parque Oriental</h2>
                    <p>
                        Um espaço de lazer e contato com a natureza.
                    </p>
                    <button>CONHECER</button>
                </div>
            </div>

            <div class="turismo-card">
                <div class="turismo-card-imagem">
                    <img src="img/mirante-sao-jose.jpg" alt="Mirante São José">
                </div>

                <div class="turismo-card-conteudo">
                    <h2>Mirante São José</h2>
                    <p>
                        Um dos principais mirantes da cidade.
                    </p>
                    <button>CONHECER</button>
                </div>
            </div>

            <div class="turismo-card">
                <div class="turismo-card-imagem">
                    <img src="img/vila-do-doce.jpg" alt="Vila do Doce">
                </div>

                <div class="turismo-card-conteudo">
                    <h2>Vila do Doce</h2>
                    <p>
                        Um espaço gastronômico e artesanal no centro da cidade.
                    </p>
                    <button>CONHECER</button>
                </div>
            </div>

        </div>

    </div>

</section>

</section>

</body>
</html>
