<div class="nova-publicacao">

    <div class="caixa">

        <h1 id="tituloPagina">
            Nova publicação
        </h1>

        <p>
            Crie uma notícia ou evento para a Feira Tecnológica.
        </p>

        <form
            id="formPublicacao"
            enctype="multipart/form-data"
        >

            <label for="tipo">Tipo</label>

            <select id="tipo" required>

                <option value="noticia">
                    Notícia
                </option>

                <option value="evento">
                    Evento
                </option>

            </select>


            <label for="titulo">Título</label>

            <input
                type="text"
                id="titulo"
                required
            >


            <label for="descricao">Descrição</label>

            <textarea
                id="descricao"
                required
            ></textarea>


            <div
                id="campoData"
                style="display: none;"
            >

                <label for="data_evento">
                    Data do evento
                </label>

                <input
                    type="date"
                    id="data_evento"
                >

            </div>


            <label for="imagem">
                Imagem
            </label>

            <input
                type="file"
                id="imagem"
                accept="image/png,image/jpeg,image/webp,image/gif"
            >


            <div id="imagemAtual"></div>


            <button type="submit">
                Publicar
            </button>


            <p id="mensagem"></p>

        </form>


        <a href="index.php?pagina=painel">
            Voltar para o painel
        </a>

    </div>

</div>


<style>

.nova-publicacao {
    min-height: calc(100vh - 80px);
    background-color: #f4f4f4;
    padding: 50px 20px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.caixa {
    max-width: 700px;
    margin: auto;
    background-color: #ffffff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}

.caixa h1 {
    margin-bottom: 10px;
    color: #222222;
    transition: color 0.3s ease;
}

.caixa > p {
    color: #666666;
    margin-bottom: 25px;
    transition: color 0.3s ease;
}

.caixa form {
    display: flex;
    flex-direction: column;
}

.caixa label {
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #222222;
    transition: color 0.3s ease;
}

.caixa input,
.caixa select,
.caixa textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    font-family: inherit;
    background-color: #ffffff;
    color: #222222;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

.caixa textarea {
    min-height: 180px;
    resize: vertical;
}

.caixa button {
    margin-top: 25px;
    padding: 13px;
    border: 0;
    border-radius: 6px;
    background-color: #b51218 !important;
    color: #ffffff !important;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background-color 0.2s ease;
}

.caixa button:hover {
    background-color: #941016 !important;
}

.caixa a {
    display: inline-block;
    margin-top: 20px;
    color: #b51218;
    text-decoration: none;
    transition: color 0.3s ease;
}

.caixa a:hover {
    text-decoration: underline;
}

#mensagem {
    margin-top: 15px;
    color: #222222;
    transition: color 0.3s ease;
}

#imagemAtual img {
    width: 200px;
    margin-top: 15px;
    border-radius: 6px;
}

/* Suporte para Tema Noturno / Dark Mode */
body.tema-noturno .nova-publicacao,
body.dark-mode .nova-publicacao {
    background-color: #121212 !important;
}

body.tema-noturno .caixa,
body.dark-mode .caixa {
    background-color: #1e1e1e !important;
    color: #ffffff !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    border: 1px solid #2a2a2a;
}

body.tema-noturno .caixa h1,
body.dark-mode .caixa h1 {
    color: #ffffff !important;
}

body.tema-noturno .caixa > p,
body.dark-mode .caixa > p {
    color: #cccccc !important;
}

body.tema-noturno .caixa label,
body.dark-mode .caixa label {
    color: #ffffff !important;
}

body.tema-noturno .caixa input,
body.tema-noturno .caixa select,
body.tema-noturno .caixa textarea,
body.dark-mode .caixa input,
body.dark-mode .caixa select,
body.dark-mode .caixa textarea {
    background-color: #2a2a2a !important;
    color: #ffffff !important;
    border-color: #444444 !important;
}

body.tema-noturno #mensagem,
body.dark-mode #mensagem {
    color: #ffffff !important;
}

body.tema-noturno .caixa a,
body.dark-mode .caixa a {
    color: #ff4d4d !important;
}

</style>


<script>

const empresa =
    JSON.parse(
        localStorage.getItem("empresa")
    );

if (!empresa) {

    window.location.href =
        "index.php?pagina=login";

}


const parametros =
    new URLSearchParams(
        window.location.search
    );

const id =
    parametros.get("id");


const tipo =
    document.getElementById("tipo");

const campoData =
    document.getElementById("campoData");

const titulo =
    document.getElementById("titulo");

const descricao =
    document.getElementById("descricao");

const dataEvento =
    document.getElementById("data_evento");

const mensagem =
    document.getElementById("mensagem");

const form =
    document.getElementById("formPublicacao");


tipo.addEventListener(
    "change",
    function () {

        if (tipo.value === "evento") {

            campoData.style.display =
                "block";

            dataEvento.required =
                true;

        } else {

            campoData.style.display =
                "none";

            dataEvento.required =
                false;

        }

    }
);


async function carregarEdicao() {

    if (!id) {
        return;
    }

    document.getElementById(
        "tituloPagina"
    ).textContent =
        "Editar publicação";

    try {

        const resposta =
            await fetch(
                "http://localhost:3000/api/posts/" + id
            );

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            mensagem.textContent =
                dados.erro;

            return;
        }

        const post =
            dados.post;

        tipo.value =
            post.tipo;

        titulo.value =
            post.titulo;

        descricao.value =
            post.descricao;

        if (
            post.tipo === "evento"
        ) {

            campoData.style.display =
                "block";

            dataEvento.required =
                true;

            if (post.data_evento) {

                dataEvento.value =
                    post.data_evento.substring(
                        0,
                        10
                    );
            }
        }

        if (post.imagem) {

            document.getElementById(
                "imagemAtual"
            ).innerHTML = `
                <p>Imagem atual:</p>
                <img
                    src="http://localhost:3000/uploads/${post.imagem}"
                >
            `;
        }

    } catch (erro) {

        mensagem.textContent =
            "Erro ao carregar publicação.";

    }

}


form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const dados =
            new FormData();

        dados.append(
            "tipo",
            tipo.value
        );

        dados.append(
            "titulo",
            titulo.value
        );

        dados.append(
            "descricao",
            descricao.value
        );

        if (
            tipo.value === "evento"
        ) {

            dados.append(
                "data_evento",
                dataEvento.value
            );
        }

        const arquivo =
            document.getElementById(
                "imagem"
            ).files[0];

        if (arquivo) {

            dados.append(
                "imagem",
                arquivo
            );
        }

        mensagem.textContent =
            id
                ? "Salvando..."
                : "Publicando...";

        try {

            const resposta =
                await fetch(
                    id
                        ? "http://localhost:3000/api/posts/" + id
                        : "http://localhost:3000/api/posts",
                    {
                        method:
                            id
                                ? "PUT"
                                : "POST",

                        credentials: "include",

                        body: dados
                    }
                );

            const resultado =
                await resposta.json();

            if (!resposta.ok) {

                mensagem.textContent =
                    resultado.erro;

                return;
            }

            mensagem.textContent =
                id
                    ? "Publicação atualizada!"
                    : "Publicação publicada!";

            setTimeout(
                function () {

                    window.location.href =
                        "index.php?pagina=painel";

                },
                800
            );

        } catch (erro) {

            mensagem.textContent =
                "Erro ao conectar com o servidor.";

        }

    }
);


carregarEdicao();

</script>
