<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Ribeirão Pires</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================
         IMAGEM PRINCIPAL
    ========================================= -->

    <section class="hero">

        <!--
            COLOQUE O CAMINHO DA SUA IMAGEM NO src

            Exemplo:
            src="img/ribeirao-pires.jpg"
        -->
        <img
            class="hero-image"
            src="imgs/relogio.png"
            alt="Imagem de Ribeirão Pires"
        >

    </section>


    <!-- ========================================
         APRESENTAÇÃO
    ========================================= -->

    <section class="apresentacao">

        <h1>SEJA BEM-VINDO(A)</h1>

        <p>
            Explore tudo o que Ribeirão Pires tem a oferecer.
        </p>

        <p>
            Descubra notícias, eventos e nossa história.
        </p>

        <a href="#" class="btn-conhecer">
            CONHECER MAIS
        </a>

    </section>


    <!-- ========================================
         CARDS
    ========================================= -->

    <section class="cards">

        <!-- CARD 1 - FUNDO CINZA -->
        <div class="card card-1">

            <div class="card-conteudo">

                <h2>Título do Card</h2>

                <p>
                    Coloque aqui o conteúdo deste card.
                </p>

            </div>

        </div>


        <!-- CARD 2 - FUNDO BRANCO -->
        <div class="card card-2">

            <div class="card-conteudo">

                <h2>Título do Card</h2>

                <p>
                    Coloque aqui o conteúdo deste card.
                </p>

            </div>

        </div>


        <!--
            Você pode simplesmente copiar um dos cards
            acima para criar novos.
        -->

</html>
