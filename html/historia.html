<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>História de Ribeirão Pires</title>

</head>

<body>

    <!-- ========================================
         PÁGINA DA HISTÓRIA
    ======================================== -->

    <main class="historia-container">


        <!-- ====================================
             IMAGEM
        ==================================== -->

        <div class="historia-imagem">

            <img
                src="imgs/torre_miracu.png"
                alt="Imagem relacionada à história de Ribeirão Pires"
            >

        </div>


        <!-- ====================================
             ÁREA DOS TEXTOS
        ==================================== -->

        <section class="historia-textos">


            <!-- ==================================
                 ORIGENS
            ================================== -->

            <article class="historia-secao">

                <h2>Origens</h2>

                <div class="historia-card">
                    <p id="origens" class="texto-txt" data-arquivo="textos\origens.txt"></p>
                </div>

            </article>


            <!-- ==================================
                 DE FLORESTA PARA CIDADE
            ================================== -->

            <article class="historia-secao">

                <h2>De floresta para cidade</h2>

                <div class="historia-card">

                    <p id="floresta" class="texto-txt" data-arquivo="textos\floresta.txt"></p>

                </div>

            </article>


        </section>

    </main>

    <!-- ========================================
        JS DA HISTORIA
    ==========================================-->

    <script>
        const paragrafos = document.querySelectorAll(".texto-txt");

        paragrafos.forEach(paragrafo => {

            const caminho = paragrafo.dataset.arquivo;

            fetch(caminho)
                .then(resposta => resposta.text())
                .then(texto => {

                    paragrafo.textContent = texto;

                });

        });
    
    </script>

    <!-- ========================================
         CSS DA PÁGINA
    ======================================== -->

    <style>

        /* ========================================
           CONFIGURAÇÕES GERAIS
        ======================================== */

        .historia-container {

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            gap: 70px;

            padding: 70px 8%;

            background-color: var(--fundo);
        }


        /* ========================================
           IMAGEM
        ======================================== */

        .historia-imagem {

            flex: 0 0 558px;

            display: flex;
            justify-content: center;
        }


        .historia-imagem img {

            width: 558px;
            height: auto;

            display: block;

            padding: 12px;

            background-color: var(--branco);

            border-radius: 50px;

            object-fit: contain;
        }


        /* ========================================
           ÁREA DOS TEXTOS
        ======================================== */

        .historia-textos {

            flex: 1;

            max-width: 700px;

            display: flex;
            flex-direction: column;

            gap: 35px;
        }


        /* ========================================
           SEÇÃO
        ======================================== */

        .historia-secao {

            width: 100%;
        }


        /* ========================================
           TÍTULO
        ======================================== */

        .historia-secao h2 {

            font-size: 35px;

            margin-bottom: 15px;

            color: var(--texto);
        }


        /* ========================================
           CARD
        ======================================== */

        .historia-card {

            width: 100%;

            padding: 35px 40px;

            background-color: var(--branco);

            border-radius: 25px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }


        /* ========================================
           TEXTO
        ======================================== */

        .historia-card p {

            font-size: 18px;

            line-height: 1.7;

            color: var(--texto-secundario);

            white-space: pre-line;
        }


        /* ========================================
           RESPONSIVIDADE
        ======================================== */

        @media (max-width: 1100px) {

            .historia-container {

                gap: 40px;

                padding: 50px 5%;
            }

            .historia-imagem {

                flex: 0 0 45%;
            }

            .historia-imagem img {

                width: 100%;
            }

        }


        @media (max-width: 800px) {

            .historia-container {

                flex-direction: column;

                align-items: center;

                padding: 40px 8%;
            }


            .historia-imagem {

                width: 100%;

                max-width: 558px;
            }


            .historia-textos {

                width: 100%;

                max-width: 700px;
            }


            .historia-secao h2 {

                font-size: 30px;
            }


            .historia-card {

                padding: 30px;
            }

        }

    </style>

</body>

</html>
